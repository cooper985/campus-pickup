<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">校园取件助手 · Campus Pickup</title>
  <desc id="desc">暖纸色校园取件助手封面。左侧介绍截图识别、通知粘贴与按站取件；右侧为现有界面的简化示意，全部地点及取件码为虚构数据。</desc>
  <defs>
