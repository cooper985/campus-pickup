  <circle cx="970" cy="304" r="207" fill="#F2E5DC"/>
  <circle cx="716" cy="513" r="10" fill="#C87356"/>
  <circle cx="1145" cy="101" r="6" fill="#C87356"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
