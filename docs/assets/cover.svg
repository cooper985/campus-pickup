    <text x="64" y="211" fill="#25231F" font-size="54" font-weight="750">把零散通知，</text>
    <text x="64" y="285" fill="#A94F38" font-size="54" font-weight="750">整理成一张取件清单。</text>
    <text x="66" y="341" fill="#68645E" font-size="22">从消息到驿站，让每一件快递都有着落。</text>

    <g font-size="18" fill="#9E4934" text-anchor="middle">
